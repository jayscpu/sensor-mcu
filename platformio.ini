; Sensor MCU for the spray pyrolysis slider.
; Logs process sensors over USB serial and broadcasts them as JSON over UDP
; to the CrowPanel pendant running FluidTouch (see README.md).
;
; Target board: ESP32-S3 DevKitC-1. Pins live in include/config.h.

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Route Arduino's Serial to the native USB-CDC port from boot. Without this,
; Serial defaults to UART0 (GPIO43/44), which isn't wired to the USB
; connector on this board (no separate USB-UART bridge chip); code runs
; and flashing still works via the chip's ROM USB-Serial/JTAG, but nothing
; printed via Serial is visible in a terminal.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit MAX31856 library@^1.2.0
    adafruit/Adafruit MAX31865 library@^1.6.0
    adafruit/Adafruit SHT4x Library@^1.0.0
    adafruit/Adafruit SGP40 Sensor@^1.1.0
    adafruit/Adafruit MPRLS Library@^1.1.0
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit BusIO@^1.14.0
    adafruit/Adafruit Unified Sensor@^1.1.9
